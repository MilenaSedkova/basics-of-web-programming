<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moon Coach — Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/form.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <div class="logo"><img src="../pictures/logo.svg" alt="Moon Coach"></div>
      <div class="header-right">
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="catalog.html">Catalog</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <section class="page-hero">
    <h1 class="page-title">Welcome Back</h1>
    <p class="page-subtitle">Log in to manage your services and transformation</p>
  </section>

  <main class="form-container">
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div style="position: relative; display: flex; align-items: center; width: 100%;">
          <input type="password" id="loginPassword" class="form-control" required style="padding-right: 45px;">
          <button type="button" class="toggle-password-btn" data-target="loginPassword" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 18px; z-index: 10; line-height: 1; padding: 0;">👁️</button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="submit-btn" disabled>Log In</button>
      <p style="text-align: center; margin-top: 20px; font-family: 'Oxygen', sans-serif; font-size: 14px;">
        Don't have an account? <a href="register.html" style="color: #8B7500; text-decoration: none; font-weight: 700;">Sign up</a>
      </p>
    </form>
  </main>
  
  <script type="module" src="../js/login.js"></script>
</body>
</html>
