<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  
  <link rel="icon" type="image/svg+xml" href="../pictures/favicon.svg">
  <title>Moon Coach — Leave Feedback</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/form.css" />
</head>
<body>

  <div class="burger-overlay"></div>
  <div class="burger-menu">
    <div class="burger-menu-header">
      <img src="../pictures/logo.svg" alt="Moon Coach">
    </div>
    <ul class="burger-nav-links">
      <li><a href="../index.html#hero">Homepages</a></li>
      <li><a href="../index.html#about">About Pages</a></li>
      <li><a href="../index.html#others">Others</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li class="burgerAdminPanelBtn" style="display: none;"><a href="admin.html" style="color: #8B7500; font-weight: 700;">Admin Panel</a></li>
      <li class="burgerAuthBlock"><a href="login.html">Log In</a></li>
      <li class="burgerFeedbackLinkBtn" style="display: none;"><a href="feedback.html">Leave Feedback</a></li>
    </ul>
  </div>

  <header class="header">...</header>

  <main class="form-container">
    <h2>Leave Feedback</h2>
    <form id="feedbackForm" novalidate>
      <div class="form-group">
        <label for="serviceSelect">Select Service you purchased <span class="required">*</span></label>
        <select id="serviceSelect" class="form-control" required>
          <option value="">-- Loading your purchases --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="rating">Rating (1-5) <span class="required">*</span></label>
        <input type="number" id="rating" class="form-control" min="1" max="5" required>
      </div>

      <div class="form-group">
        <label for="comment">Your Feedback (min 20 chars) <span class="required">*</span></label>
        <textarea id="comment" class="form-control" rows="5" minlength="20" required></textarea>
      </div>

      <button type="submit" id="submitFeedbackBtn" class="submit-btn" disabled>Submit Feedback</button>
    </form>
  </main>
  
  <script type="module" src="../js/feedback.js"></script>
  <script src="../js/burger.js"></script>
</body>
</html>
