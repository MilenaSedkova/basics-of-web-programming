<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  
  <link rel="icon" type="image/svg+xml" href="../pictures/favicon.svg">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/form.css" />
</head>
<body>

  <div class="burger-overlay"></div>
  <div class="burger-menu">
    <div class="burger-menu-header">
      <img src="../pictures/logo.svg" alt="Moon Coach">
    </div>
    <ul class="burger-nav-links">
      <li><a href="../index.html#hero">Homepages</a></li>
      <li><a href="../index.html#about">About Pages</a></li>
      <li><a href="../index.html#others">Others</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li class="burgerAdminPanelBtn" style="display: none;"><a href="admin.html" style="color: #8B7500; font-weight: 700;">Admin Panel</a></li>
      <li class="burgerAuthBlock"><a href="login.html">Log In</a></li>
      <li class="burgerFeedbackLinkBtn" style="display: none;"><a href="feedback.html">Leave Feedback</a></li>
    </ul>
  </div>

  <header class="header">
    <nav class="navbar">
      <div class="logo">
        <img src="../pictures/logo.svg" alt="Moon Coach" onerror="this.style.display='none'">
      </div>

      <div class="burger-icon">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="header-right">
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="catalog.html">Catalog</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="form-container" style="max-width: 1000px;">
    <h1>Admin Panel</h1>
    
    <div class="admin-tabs">
      <button class="admin-tab active" id="tabServices">Manage Services</button>
      <button class="admin-tab" id="tabFeedback">Manage Feedback</button>
    </div>

    <section id="sectionServices">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Manage Services</h3>
        <button id="addServiceBtn" class="submit-btn" style="width: auto; padding: 10px 20px; transform: none; margin: 0;">Add New Service</button>
      </div>

      <!-- Modal for Service Form -->
      <div id="serviceModal" class="modal-overlay" style="display: none;">
        <div class="modal-content form-container" style="max-width: 500px; padding: 30px; position: relative;">
          <h3 id="modalTitle">Add Service</h3>
          <form id="serviceForm" novalidate>
            <input type="hidden" id="serviceId">
            <div class="form-row" style="grid-template-columns: 1fr;">
              <div class="form-group">
                <label>Name</label>
                <input type="text" id="svcName" class="form-control" required>
              </div>
              <div class="form-group">
                <label>Price</label>
                <input type="number" id="svcPrice" class="form-control" required min="1">
              </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
              <button type="submit" id="saveServiceBtn" class="submit-btn" style="transform: none; margin: 0;" disabled>Save</button>
              <button type="button" id="closeModalBtn" class="submit-btn" style="background: #ccc; color: #333; transform: none; margin: 0;">Cancel</button>
            </div>
          </form>
        </div>
      </div>
      
      <!-- Confirm Delete Modal -->
      <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-content form-container" style="max-width: 400px; padding: 30px; text-align: center;">
          <h3>Are you sure?</h3>
          <p>This action cannot be undone.</p>
          <div style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
            <button id="confirmDeleteBtn" class="submit-btn" style="background: #dc3545; transform: none; margin: 0;">Delete</button>
            <button id="cancelDeleteBtn" class="submit-btn" style="background: #ccc; color: #333; transform: none; margin: 0;">Cancel</button>
          </div>
        </div>
      </div>

      <table class="data-table" style="margin-top: 30px;">
        <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Actions</th></tr></thead>
        <tbody id="servicesTableBody"></tbody>
      </table>
    </section>

    <section id="sectionFeedback" style="display:none;">
      <h3>All Feedback</h3>
      <div style="margin-bottom: 20px;">
        <input type="text" id="filterUser" class="form-control" placeholder="Filter by User Nickname" style="width:200px; display:inline;">
        <input type="text" id="filterService" class="form-control" placeholder="Filter by Service ID" style="width:200px; display:inline;">
      </div>
      <table class="data-table">
        <thead><tr><th>ID</th><th>User</th><th>Service ID</th><th>Rating</th><th>Comment</th><th>Action</th></tr></thead>
        <tbody id="feedbackTableBody"></tbody>
      </table>
    </section>
  </main>
  
  <script type="module" src="../js/admin.js"></script>
  <script src="../js/burger.js"></script>
</body>
</html>
