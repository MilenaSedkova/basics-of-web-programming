<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/form.css" />
</head>
<body>
  <header class="header">...</header>

  <main class="form-container" style="max-width: 1000px;">
    <h1>Admin Panel</h1>
    
    <div class="admin-tabs">
      <button class="admin-tab active" id="tabServices">Manage Services</button>
      <button class="admin-tab" id="tabFeedback">Manage Feedback</button>
    </div>

    <section id="sectionServices">
      <h3>Add / Edit Service</h3>
      <form id="serviceForm" novalidate>
        <input type="hidden" id="serviceId">
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="svcName" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Price</label>
            <input type="number" id="svcPrice" class="form-control" required min="1">
          </div>
        </div>
        <button type="submit" id="saveServiceBtn" class="submit-btn" disabled>Save Service</button>
      </form>

      <table class="data-table" style="margin-top: 30px;">
        <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Actions</th></tr></thead>
        <tbody id="servicesTableBody"></tbody>
      </table>
    </section>

    <section id="sectionFeedback" style="display:none;">
      <h3>All Feedback</h3>
      <div style="margin-bottom: 20px;">
        <input type="text" id="filterUser" class="form-control" placeholder="Filter by User Nickname" style="width:200px; display:inline;">
        <input type="text" id="filterService" class="form-control" placeholder="Filter by Service ID" style="width:200px; display:inline;">
      </div>
      <table class="data-table">
        <thead><tr><th>ID</th><th>User</th><th>Service ID</th><th>Rating</th><th>Comment</th><th>Action</th></tr></thead>
        <tbody id="feedbackTableBody"></tbody>
      </table>
    </section>
  </main>
  
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
